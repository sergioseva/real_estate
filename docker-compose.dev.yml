services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_estate
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./deploy/init:/docker-entrypoint-initdb.d

volumes:
  pgdata_dev:
